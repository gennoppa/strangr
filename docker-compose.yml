services:
  backend:
    build: ./backend
    environment:
      # Behind nginx: trust X-Forwarded-For for bans, and allow the nginx origin.
      APP_TRUST_PROXY_HEADERS: "true"
      APP_ALLOWED_ORIGINS: "http://localhost:3000"
      # Add a TURN server for production, e.g.:
      # SPRING_APPLICATION_JSON: '{"app":{"ice-servers":[{"urls":["stun:stun.l.google.com:19302"]},{"urls":["turn:turn.example.com:3478"],"username":"user","credential":"pass"}]}}'
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional TURN relay for users behind strict NATs. Uncomment, set a real
  # external IP / credentials, and add it to the backend's ice-servers above.
  # turn:
  #   image: coturn/coturn:4.6
  #   network_mode: host
  #   command: >
  #     -n --log-file=stdout --lt-cred-mech --fingerprint
  #     --realm=strangr --user=user:pass
  #     --external-ip=YOUR_PUBLIC_IP
  #     --min-port=49160 --max-port=49200
